server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA owns its routes: anything that is not a real file is index.html,
    # so /submissions/abc works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API, so the browser never makes a cross-origin request.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API reads this only when TRUSTED_PROXY_HOPS says to; with one
        # proxy in front, set TRUSTED_PROXY_HOPS=1 so rate limits key on the
        # real client rather than on this container.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for GET /runs/{id}?wait_ms=… to hold the connection.
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames are immutable; index.html must not be cached or
    # users keep the old bundle after a deploy.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
