# Behind an HTTPS proxy (Caddy in production) keep the scheme it saw, so the
# API builds https:// OAuth redirect URIs; on its own, this server's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# And the port the browser used (5173 locally, 443 behind HTTPS): without it
# the API assumes the scheme's default port and the OAuth redirect URI loses
# ":5173". Taken from a proxy's X-Forwarded-Port, else from the Host header.
map $forwarded_proto $default_port {
    https   443;
    default 80;
}
map $http_host $host_port {
    "~:(?<p>[0-9]+)$" $p;
    default           $default_port;
}
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ""      $host_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA owns its routes: anything that is not a real file is index.html,
    # so /submissions/abc works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live contest updates (Server-Sent Events): pass each event straight
    # through instead of buffering, and keep the stream open; the API sends a
    # heartbeat every 20 s.
    location ~ ^/api/v1/contests/[^/]+/live$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Same-origin API, so the browser never makes a cross-origin request.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts these only from internal addresses such as this
        # container, so rate limits key on the real client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        # Long enough for GET /runs/{id}?wait_ms=… to hold the connection.
        proxy_read_timeout 60s;
    }

    # Sign in with Google / GitHub: the redirect start and the provider's
    # callback. $http_host keeps the port, so the API builds the redirect URI
    # as <this origin>/login/oauth2/code/{provider} and the sign-in cookies
    # belong to this origin.
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # Hashed asset filenames are immutable; index.html must not be cached or
    # users keep the old bundle after a deploy.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
